# RF Track 容器编排（S9 次形态）。注意 name: 固定——同目录多 compose 项目
# 共享默认项目名时会互相误删容器（本机踩过，见 deploy/README.md「坑」一节）。
name: rftrack

services:
  backend:
    build:
      context: ../..
      dockerfile: rftrack/deploy/Dockerfile
    image: rftrack-backend
    ports:
      # 宿主机端口要可覆盖：MinIO 默认占 9000，本机 2026-10-31 首跑就撞上。用 env 而不是
      # 第二个 -f 文件——compose 对 `ports` 列表是**并集合并**，override 里加一条只会变成
      # 同时发布两个端口，9000 那个照样绑失败（要替换得上 `!override` 标签）。
      - "${RFTRACK_HOST_PORT:-9000}:9000"
    environment:
      # 现场配置往这里加或用 env_file: rftrack.env。数据库路径固定在卷上，
      # 容器换掉数据不丢；**绝不**挂到容器内可随镜像消失的路径。
      RFTRACK_DB_PATH: /data/rftrack.sqlite3
      # RFTRACK_INSTANCE_ROLE: site
    volumes:
      - rftrack-data:/data
      # 控制台（`/app/`）发的是 `web/dist/`：那是 node 构建产物，既不在 git 里，也不该为了它
      # 在镜像里装一套 node 工具链（主形态的 Pi 更跑不动）。所以它跟现场配置一样从外面进来。
      # 挂点就是后端默认值在容器里的位置（`app/config.py` 的 `DEFAULT_CONSOLE_DIR` = 仓库根下
      # `web/dist`，容器里是 `/app/web/dist`），不需要另设 `RFTRACK_WEB_DIR`。
      # 没构建也能起：挂载只会得到一个空目录，`/api/health` 的 `console` 与根上那页入口都如实
      # 说"配了目录但里面没有 index.html"，不谎报也不 404（`mount_console` 那条判据）。
      # 更新流程 = `cd web && npm run build` 之后 `docker compose restart`——挂没挂是启动那一刻
      # 看的，运行中往目录里补文件不会让 `/app` 这一节自己活过来。
      - ../../web/dist:/app/web/dist:ro
    restart: unless-stopped

volumes:
  rftrack-data:
