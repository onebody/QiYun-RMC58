; Widscan58 firmware. GPL-3.0-or-later.
;
; pioarduino 55.03.312-1 = ESP-IDF 5.5.5, PlatformIO Core >= 6.2.
; esp-sdr pins ESP-IDF 25fe69f9 (6.2-dev) for its private PHY ABI. Every PHY
; function src/radio/s3 calls is instruction-identical between that pin and
; IDF 5.5.5 (tools/check_phy_abi.sh esp32s3 25fe69f9... v5.5.5). Re-run the
; check before changing the platform version.

[platformio]
default_envs = esp32c5

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = espidf
monitor_speed = 115200
; Reconfigure when git describe (PROJECT_VER) changes; see the script.
extra_scripts = pre:version_check.py

[env:esp32s3]
; ESP32-S3 "Micro" board: native USB Serial/JTAG only, 4 MB flash.
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
; The USB Serial/JTAG peripheral resets into download mode in hardware;
; no BOOT button is needed even while our firmware runs.
board_upload.before_reset = usb-reset
upload_speed = 921600
; S3-Zero board has a WS2812 status LED on GPIO21 — scan firmware uses the
; same signal-driven backend as the C5 head (any channel heard → steady green).
build_flags = -DRX_TARGET_S3=1 -DSTATUS_LED_GPIO=21

[env:esp32s3-relay]
; The S3 as a relay host: no scanning (one PHY, and STA must sit on the AP's
; channel), Wi-Fi + ws:// uplink only. Same board and partitions as esp32s3.
; build_flags and extra_scripts replace the inherited values outright, so both
; are written out in full here.
; The env: prefix is not decoration: PlatformIO walks extends as a literal
; section name, so "esp32s3" would resolve to nothing and leave board unset
; (which fails much later, inside the platform's package setup).
; UART_LINK_BAUD pairs this image with [env:esp32c5-head]: both ends of the
; head wire run 921600. Left at the 115200 default the relay would sample the
; head's 921600 bytes as noise - alive on both sides, crc_errors climbing.
extends = env:esp32s3
; STATUS_LED_GPIO=21 inherited from esp32s3 above; RX_WIFI_RELAY selects the
; relay state-machine backend inside status_led.c (separate from the scan
; backend on both C5 and S3 scan firmware).
build_flags = -DRX_TARGET_S3=1 -DRX_WIFI_RELAY=1 -DUART_LINK_BAUD=921600 -DSTATUS_LED_GPIO=21
extra_scripts = pre:version_check.py
    pre:relay_build.py

[env:esp32c5]
; ESP32-C5-DevKitC-1 on its native USB Serial/JTAG port. The C5 PHY functions
; src/radio/c5 calls are instruction-identical between esp-sdr's IDF pin and
; IDF 5.5.5 too (tools/check_phy_abi.sh esp32c5 ...).
board = esp32-c5-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
board_upload.before_reset = usb-reset
upload_speed = 921600
build_flags = -DRX_TARGET_C5=1 -DSTATUS_LED_GPIO=27

[env:esp32c5-head]
; The C5 as a sweep head for the S3 relay (spec M2): same firmware, UART0 at
; 921600 instead of the Pi's 115200. Its own env, not a flag on esp32c5,
; because 115200 is what the RotorHazard line on the Pi is measured at - an
; image that changes it changes a shipped path. RX_TARGET_C5 is repeated
; because `extends` merging of build_flags differs between pio versions (this
; repo's esp32s3-relay already documents the replace-outright case): a
; duplicated -D is harmless, a lost one builds the wrong target.
extends = env:esp32c5
build_flags = -DRX_TARGET_C5=1 -DUART_LINK_BAUD=921600 -DSTATUS_LED_GPIO=27

[env:esp32c5-eth]
; ESP32-C5 scanner with W5500 SPI Ethernet (XIAO ESP32-C5 + W5500).
; Wiring: see src/net/eth_w5500.h (D8=SCLK D9=MISO D10=MOSI D2=CS D5=INT D6=RST).
; Same radio / scanner firmware as esp32c5, only link layer grows a TCP
; server on port 12345 so a PC can pipe frames over Ethernet.
extends = env:esp32c5
build_flags = -DRX_TARGET_C5=1 -DRX_W5500=1 -DSTATUS_LED_GPIO=27 -DETH_USE_STATIC_IP=1 -DETH_IP_ADDR='"192.168.0.98"' -DETH_IP_GATEWAY='"0.0.0.0"' -DETH_IP_NETMASK='"255.255.255.0"'

[env:native]
; Host unit tests for the target-independent scanner code.
platform = native
framework =
; src/radio: psd.c includes radio.h (real, not stubbed: the I/Q word packing is
; the contract under test). test/test_psd: the IDF/esp-dsp stand-ins psd.c needs,
; used only by that group -- nothing else on this path includes those names.
build_flags = -std=gnu11 -lm -Isrc/scan -Isrc/dsp -Isrc/net -Isrc/proto -Isrc/radio -Itest/test_psd
test_build_src = no
